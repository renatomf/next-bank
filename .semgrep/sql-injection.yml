rules:
  # API-01: SQL only with parameters ($1, $2...), never built from strings.
  - id: sql-built-from-strings
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL built by interpolation or concatenation (API-01).
      Pass values as parameters: query('... WHERE id = $1', [id]).
    pattern-either:
      - pattern: $DB.query(`...${$VALUE}...`, ...)
      - pattern: $DB.query("..." + $VALUE, ...)
      - pattern: $DB.query($VALUE + "...", ...)
      - pattern: |
          $SQL = `...${$VALUE}...`;
          ...
          $DB.query($SQL, ...);
