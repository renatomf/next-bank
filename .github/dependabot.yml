version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript up to 6.0; revisit when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types must match the Node runtime (24); bump together with the runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: pub
    # Pub workspace: one lockfile at the root for the app and its packages.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
