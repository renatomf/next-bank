name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job (API-09).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: nextbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nextbank"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Throwaway credentials for the ephemeral CI database only.
      PGHOST: localhost
      PGPASSWORD: ci-postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: nextbank
      NEXTBANK_MIGRATOR_PASSWORD: ci-migrator
      NEXTBANK_APP_PASSWORD: ci-app
      TEST_DATABASE_URL: postgres://nextbank_app:ci-app@localhost:5432/nextbank_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create database roles (same bootstrap as local)
        run: sh infra/postgres/init-roles.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # pnpm version comes from packageManager in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nextbank/api format:check
      - run: pnpm --filter @nextbank/api lint
      - run: pnpm --filter @nextbank/api typecheck
      - run: pnpm --filter @nextbank/api test

  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # Also validates the merged Android manifests and the network security config (MOB-03).
      - run: flutter build apk --debug

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # The generated client must match the API schemas (ADR 0008).
      - run: sh packages/contracts/generate.sh
      - name: Fail if the contract or the client drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image pinned by digest (API-08, API-09). Scans the whole history.
      - name: Scan for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact
