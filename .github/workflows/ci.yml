name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job (API-09).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        # Authenticated pulls: anonymous ones share the runners' IP quota on
        # Docker Hub and fail with toomanyrequests. Read-only token.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: nextbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nextbank"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Throwaway credentials for the ephemeral CI database only.
      PGHOST: localhost
      PGPASSWORD: ci-postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: nextbank
      NEXTBANK_MIGRATOR_PASSWORD: ci-migrator
      NEXTBANK_APP_PASSWORD: ci-app
      TEST_DATABASE_URL: postgres://nextbank_app:ci-app@localhost:5432/nextbank_test?sslmode=disable
      TEST_MIGRATION_DATABASE_URL: postgres://nextbank_migrator:ci-migrator@localhost:5432/nextbank_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create database roles (same bootstrap as local)
        run: sh infra/postgres/init-roles.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm version comes from packageManager in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nextbank/api format:check
      - run: pnpm --filter @nextbank/api lint
      - run: pnpm --filter @nextbank/api typecheck
      - run: pnpm --filter @nextbank/api arch
      - run: pnpm --filter @nextbank/api test:coverage
      # The deploy's client IP check, against a fake curl (API-14).
      - run: sh infra/scripts/check-client-ip_test.sh

  mobile:
    name: Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # The NDK the Android build asks for (Flutter 3.47.5 and its plugins): cached,
      # since downloading it on every build is slow and has failed here. Bump it with Flutter.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-${{ runner.os }}-28.2.13676358
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Design system
        working-directory: packages/design_system
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
      # Also validates the merged Android manifests and the network security config (MOB-03).
      - run: flutter build apk --debug

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # The generator image comes from Docker Hub: authenticated, as in the API job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The generated client must match the API schemas (ADR 0008).
      - run: sh packages/contracts/generate.sh
      - name: Fail if the contract or the client drifted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image pinned by digest (API-08, API-09). Scans the whole history.
      - name: Scan for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact

  dependencies:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Known vulnerabilities in every lockfile: npm and pub (API-09). Image pinned by digest.
      - name: Scan lockfiles
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --recursive .

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Semgrep image comes from Docker Hub: authenticated, as in the API job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Project rules (.semgrep/, incl. SQL built from strings, API-01) plus the
      # TypeScript and Node registry rulesets. Image pinned by digest; no telemetry.
      - name: Static analysis
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --config .semgrep --config p/typescript --config p/nodejs
          --metrics=off --error
