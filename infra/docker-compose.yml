# Local environment. Values come from infra/.env (copy .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in infra/.env}
      POSTGRES_DB: nextbank
      NEXTBANK_MIGRATOR_PASSWORD: ${NEXTBANK_MIGRATOR_PASSWORD:?set it in infra/.env}
      NEXTBANK_APP_PASSWORD: ${NEXTBANK_APP_PASSWORD:?set it in infra/.env}
      NEXTBANK_SIMULATOR_PASSWORD: ${NEXTBANK_SIMULATOR_PASSWORD:?set it in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextbank"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
