name: design_system
description: "next bank design system: tokens, theme and components (docs/design/brief.md)."
publish_to: none

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The QR Code matrix (Reed-Solomon and masks) for the Receber screen; drawn
  # here with a CustomPainter (v1.1.0 plan, task 3). Pure Dart, BSD-3.
  qr: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # Bundled, never fetched at runtime: no network call to third parties and
  # the same rendering offline. SIL Open Font License, files in fonts/.
  fonts:
    - family: Sora
      fonts:
        - asset: fonts/Sora-Variable.ttf
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Variable.ttf
  assets:
    # The green glass art behind the Unlock screen and the balance card:
    # made by the developer.
    - assets/images/bg_splash.jpg
