name: next_bank
description: "next bank — app mobile (Android e iOS)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  design_system: any
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  local_auth: 3.0.2
  # Pinned below 2.3.0 (2026-10-13) until it is two weeks old.
  local_auth_android: 2.3.0
  # Reads the Pix QR Code with the camera (v1.1.0 plan, task 4; E1: ML Kit
  # bundled, so the first read needs no download).
  mobile_scanner: 7.4.2
  nextbank_api:
    path: ../../packages/contracts/dart
  path_provider: 2.1.6
  sentry_flutter: 10.2.0
  share_plus: 13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  share_plus_platform_interface: 7.2.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
